[project]
name = "bmore-casa"
version = "0.1.0"
description = "Interactive 3D data visualization of Baltimore City's housing landscape, built on DHCD open data."
readme = "README.md"
authors = [
    { name = "pwnwriter", email = "hi@pwnwriter.me" }
]
requires-python = ">=3.12"
dependencies = [
    "anywidget>=0.9,<0.10",
    "duckdb>=1.1",
    "httpx>=0.27",
    "marimo>=0.24.2,<0.25",
    "numpy>=2.0",
    "pandas>=2.3,<4",
    "plotly>=6,<8",
    "polars>=1.9",
    "pyarrow>=17",
    "shapely>=2.0",
    "traitlets>=5.14,<6",
    "wigglystuff==0.5.26",
]

[project.scripts]
bmore-casa = "bmore_casa.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
